spring:
    application:
        name: fileviewerapplication
    servlet:
        multipart:
            enabled: true
            max-file-size: 2048MB
            max-request-size: 2048MB
    thymeleaf:
        cache: true
        mode: HTML
        check-template: true
        check-template-location: true
        prefix: classpath:/templates/
        suffix: .html
    web:
        resources:
            cache:
                cachecontrol:
                    max-age: 365d
                    cache-public: true
            chain:
                enabled: true
                strategy:
                    control:
                        enabled: true
                        paths: /**
server:
    port: 8083
    tomcat:
        threads:
            min-spare: 20
            max: 200
        accept-count: 200
    max-http-header-size: 16KB
    servlet:
        session:
            timeout: 30m
viewer:
  recordLength: 255
  charset: Cp037
  prefixIndexLength: 10
  index:
    workers: 4
    progressStep: 8192
  export:
    bufferSize: 1048576
  chunk:
    enabled: true
    windowSizeMB: 512
  cleanup:
    # Delay before starting cleanup after user clicks "Clear Cache"
    initial-delay-minutes: 10

    # Retry delay between cleanup attempts
    retry-delay-ms: 60000

    # Maximum cleanup retry attempts
    max-attempts: 10

    # Maximum concurrent cleanup workers
    worker-count: 3

    # Startup cleanup: delete session dirs older than this
    startup-cleanup-minutes: 30
